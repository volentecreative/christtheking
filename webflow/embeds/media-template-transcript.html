<!-- Christ the King — Media Template page → the HTML Embed inside .media-transcript
     (last child, after .media-transcript_body). Source of truth for that embed.
     Transcript rows, the playing-row mark, follow-along, the YouTube link-up, and
     the transcript tools: search, copy, download; expand / play-pause / close on
     tablet/phone. There the transcript is an inline 22rem box (follows the
     sermon while it plays) whose expand button opens the same box as a bottom
     sheet: .media-secondary is a narthex drawer (vci-modal="drawer", key
     "transcript", inline at 992px+), .media-transcript its sheet part. -->
<style>
  [data-t-row] {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.85rem;
    /* Timestamp sits on the first line of its text: baselines aligned. */
    align-items: baseline;
    margin: 0;
    padding: 0.5rem 0.6rem;
    border-radius: 0.4rem;
    cursor: pointer;
    color: var(--_theme---text-03);
    transition:
      color 0.15s ease,
      background-color 0.15s ease;
  }
  @media (hover: hover) {
    [data-t-row]:hover {
      background: rgba(255, 255, 255, 0.06);
    }
  }
  [data-t-row][data-t-active] {
    color: var(--_theme---text-01);
  }
  /* The transcript is timed about every 45 seconds. Within the playing row
     each sentence's start is estimated from its length, and the one being
     spoken gets a soft rounded highlight. The padding is cancelled by an
     equal negative margin so the words don't move, and the highlight is
     cloned onto each line a wrapped sentence spans. */
  [data-t-s] {
    padding: 0.1em 0.2em;
    margin: 0 -0.2em;
    border-radius: 0.3em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-color 0.25s ease;
  }
  [data-t-row][data-t-active] [data-t-s][data-t-now] {
    background-color: color-mix(in srgb, var(--_theme---accent-01) 20%, transparent);
  }
  /* Matches .text-style-mono (font) at the .text-size-small size (0.875rem).
     Values copied from those classes, not combo-classed, because the time
     label is generated inside the CMS rich text and can't carry a class. */
  [data-t-time] {
    color: inherit;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    white-space: nowrap;
  }
  [data-t-text] {
    display: block;
    color: inherit;
  }

  /* Header: title · tools (inside the sheet's drag handle). The title and tools sit
     on shared utility classes, so their layout inside this one header is set
     here rather than on the classes. */
  .media-transcript_header > h3 {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  [data-transcript-tools] {
    margin-left: auto;
    flex: none;
  }
  /* Icon state swaps: play ⇄ pause follows the player; copy shows a tick
     for a moment after copying. The alternate icons (pause, tick) are
     hidden by default in the style panel (.button-icon.is-alt). */
  [data-transcript-play][data-playing] [data-icon='pause'],
  [data-transcript-copy][data-done] [data-icon='done'] {
    display: block;
  }
  [data-transcript-play][data-playing] [data-icon='play'],
  [data-transcript-copy][data-done] [data-icon='copy'] {
    display: none;
  }
  [data-transcript-play][aria-disabled='true'] {
    opacity: 0.4;
    cursor: default;
  }
  /* Search row: the media page's search field (.media-filters_search /
     .media-filters_input) re-used; its toolbar layout (full-width, first on
     tablet, 14rem cap) is undone for this row. */
  /* Closed by default (.media-transcript_header.is-search, style panel)
     until the search button opens it. */
  [data-transcript-search][data-open] {
    display: flex;
  }
  [data-transcript-search] .media-filters_search {
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
    order: 0;
  }
  [data-transcript-search] .media-filters_input {
    max-width: none;
    min-width: 0;
    min-height: 2.5rem;
    padding-right: 1rem;
    font-size: 16px;
  }
  [data-transcript-count]:empty {
    display: none;
  }
  [data-transcript-count] {
    flex: none;
    min-width: 4.5em;
    text-align: right;
    white-space: nowrap;
  }
  ::highlight(transcript-match) {
    background-color: color-mix(in srgb, var(--_theme---accent-01) 35%, transparent);
    color: var(--_theme---text-01);
  }
  ::highlight(transcript-current) {
    background-color: var(--_theme---accent-01);
    color: var(--_theme---background-01);
  }
  .transcript-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  /* Header buttons by context. Desktop card: search, copy, download.
     Tablet/phone box: + expand (.modal_close.is-expand, style panel).
     Sheet: + play/pause and close (.modal_close.is-sheet-only, hidden in the
     style panel, shown here while open), no expand. The scrim
     (.media-transcript_scrim) is hidden in the style panel too. */
  /* Safari still wants the prefixed property for the style panel's
     top/bottom fade on the scroll area. */
  .media-transcript_body {
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 1rem, black calc(100% - 1rem), transparent);
  }
  /* Synchronize (.media-transcript_sync, hidden in the style panel). */
  [data-transcript-sync][data-show] {
    display: block;
  }
  .media-transcript.is-visible [data-transcript-close],
  .media-transcript.is-visible [data-transcript-play] {
    display: flex;
  }
  /* The sheet's grab bar (.media-transcript_grab, hidden in the style panel). */
  .media-transcript.is-visible [data-transcript-grab] {
    display: block;
  }
  @media (max-width: 991px) {
    .media-transcript.is-visible [data-transcript-expand] {
      display: none;
    }
    .media-secondary.is-visible > [vci-modal='scrim'] {
      display: block;
    }
    .media-transcript.is-visible {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Collapsed, the box is a read-only preview: it follows the sermon by
       itself and lets swipes pass through to the page. Open it as the drawer
       to scroll and read freely. */
    .media-secondary:not(.is-visible) .media-transcript_body {
      overflow: hidden;
      cursor: pointer;
      /* Deeper fades than the 1rem set in the style panel: the spoken
         sentence sits just under the top one, and the Expand pill over the
         bottom one. */
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 2.5rem, black calc(100% - 4.5rem), transparent);
      mask-image: linear-gradient(to bottom, transparent, black 2.5rem, black calc(100% - 4.5rem), transparent);
    }
    /* "Expand" (.media-transcript_expand-pill, hidden in the style panel):
       tells the preview apart from a scrollable box, and opens the drawer. */
    .media-secondary:not(.is-visible) [data-transcript-expand-pill] {
      display: block;
    }
    /* Reading text one step brighter (text-02) than the desktop card's. */
    .media-secondary [data-t-row] {
      color: var(--_theme---text-02);
    }
    .media-secondary [data-t-row][data-t-active] {
      color: var(--_theme---text-01);
    }
  }
</style>
<script>
  (function () {
    var player = null,
      ready = false,
      holdPause = false,
      cues = [];
    var d = document;
    var reduced = matchMedia('(prefers-reduced-motion: reduce)');
    var $ = function (s, r) { return (r || d).querySelector(s); };

    window.onYouTubeIframeAPIReady = function () {
      init();
    };
    function api() {
      if (window.YT && window.YT.Player) {
        init();
        return;
      }
      var t = d.createElement('script');
      t.src = 'https://www.youtube.com/iframe_api';
      d.head.appendChild(t);
    }
    function getIframe() {
      return d.querySelector('iframe[src*="youtube.com/embed"], iframe[src*="youtube-nocookie.com/embed"]');
    }
    function init() {
      var ifr = getIframe();
      if (!ifr || player) return;
      if (ifr.src.indexOf('enablejsapi=1') === -1) {
        ifr.src += (ifr.src.indexOf('?') === -1 ? '?' : '&') + 'enablejsapi=1&origin=' + encodeURIComponent(location.origin);
      }
      player = new YT.Player(ifr, {
        events: {
          onReady: function () {
            ready = true;
            syncPlay();
          },
          onStateChange: function (e) {
            // A timestamp tapped in the drawer while the video had never been
            // started: YouTube starts it on seekTo, so stop it straight away.
            if (holdPause && e.data === 1) {
              holdPause = false;
              player.pauseVideo();
            }
            syncPlay();
          },
        },
      });
    }
    function state() {
      return player && ready && player.getPlayerState ? player.getPlayerState() : -1;
    }
    function inDrawer() {
      return !!(window.vci && vci.modal && vci.modal.isOpen('transcript'));
    }

    /* Timestamps. On the desktop card a tap plays from that point, as it
       always has. In the drawer it only moves the playhead: someone reading
       along keeps control of whether the sermon is playing. */
    function seek(s) {
      if (!player || !ready) return;
      if (inDrawer()) {
        var st = state();
        if (st === -1 || st === 5) holdPause = true;
        player.seekTo(s, true);
        return;
      }
      player.seekTo(s, true);
      if (player.playVideo) player.playVideo();
    }

    /* ---------- play / pause (sheet header) ---------- */
    var playBtn = $('[data-transcript-play]');
    function syncPlay() {
      if (!playBtn) return;
      var on = state() === 1 || state() === 3;
      playBtn.toggleAttribute('data-playing', on);
      playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
      playBtn.setAttribute('aria-disabled', String(!ready));
    }
    if (playBtn) {
      if (!getIframe()) {
        playBtn.style.display = 'none';
      } else {
        syncPlay();
        playBtn.addEventListener('click', function () {
          if (!ready) return;
          holdPause = false;
          if (state() === 1 || state() === 3) player.pauseVideo();
          else player.playVideo();
        });
      }
    }

    /* The sheet and the inline box are the same element, so the sheet has
       no exit slide (vci-modal-exit="none" on .media-secondary): an exit
       animation would leave the box's place empty until it finished. On
       close it drops straight back into the box with a short settle. */
    d.addEventListener('vci:modal:close', function (e) {
      if (!e.detail || e.detail.key !== 'transcript' || reduced.matches) return;
      var tr = $('.media-transcript');
      if (!tr || !tr.animate) return;
      tr.animate([{ opacity: 0, transform: 'translateY(0.75rem)' }, { opacity: 1, transform: 'none' }], {
        duration: 240,
        easing: 'cubic-bezier(.22, 1, .36, 1)',
      });
    });

    /* Split a row's text into sentences and give each an estimated start,
       spread between this timestamp and the next by length (the last row
       assumes about 14 characters a second). Only plain-text rows are split. */
    function sentences(row, start, end) {
      var span = row.querySelector('[data-t-text]');
      if (!span || span.childNodes.length !== 1 || span.firstChild.nodeType !== 3) return [];
      var text = span.firstChild.data;
      var parts = text.match(/[^.!?]+(?:[.!?]+["'\u201d\u2019)\]]*|$)\s*/g);
      if (!parts || parts.length < 2) return [];
      var total = text.length, span2 = end === null ? total / 14 : end - start, done = 0, out = [];
      span.textContent = '';
      parts.forEach(function (p) {
        var el = d.createElement('span');
        el.setAttribute('data-t-s', '');
        el.textContent = p;
        span.appendChild(el);
        out.push({ el: el, at: start + (span2 * done) / total });
        done += p.length;
      });
      return out;
    }

    function build() {
      cues = [];
      d.querySelectorAll('a[href^="#t="]').forEach(function (a) {
        var s = parseFloat(a.getAttribute('href').slice(3));
        if (isNaN(s)) return;
        var row = a.closest('p,li') || a.parentElement;
        if (!row) return;
        row.setAttribute('data-t-row', '');
        a.setAttribute('data-t-time', '');
        if (!row.querySelector('[data-t-text]')) {
          var span = d.createElement('span');
          span.setAttribute('data-t-text', '');
          var n = a.nextSibling;
          while (n) {
            var nx = n.nextSibling;
            span.appendChild(n);
            n = nx;
          }
          row.appendChild(span);
        }
        row.addEventListener('click', function (e) {
          e.preventDefault();
          seek(s);
        });
        cues.push({ s: s, row: row });
      });
      cues.sort(function (x, y) {
        return x.s - y.s;
      });
      cues.forEach(function (c, i) {
        var next = cues[i + 1];
        c.sents = sentences(c.row, c.s, next ? next.s : null);
      });

      /* Follow-along with a Synchronize button, as Spotify's lyrics do.
         While the sermon plays, each new section is brought to the top of
         the box as it starts. Scrolling it yourself while it plays lets go of it and
         shows "Synchronize" at the bottom of the box; tapping that (or a
         timestamp) snaps back and follows again. */
      var body = $('.media-transcript_body');
      var syncWrap = $('[data-transcript-sync]');
      var syncBtn = syncWrap && syncWrap.querySelector('a, button');
      var row = null, sent = null, followed = null, synced = true, ownScrollUntil = 0;
      var mobile = matchMedia('(max-width: 991px)');
      var host = $('.media-transcript');
      function playing() { var st = state(); return st === 1 || st === 3; }
      // The collapsed mobile box: a preview the reader can't scroll.
      function preview() { return mobile.matches && !(host && host.classList.contains('is-visible')); }
      function showSync() {
        if (syncWrap) syncWrap.toggleAttribute('data-show', !synced && playing() && !preview());
      }
      function letGo() {
        if (preview()) return;
        // Scroll events from our own smooth scroll keep extending its window.
        if (Date.now() < ownScrollUntil) { ownScrollUntil = Date.now() + 150; return; }
        if (!playing()) return;
        synced = false;
        showSync();
      }
      if (body) {
        body.addEventListener('scroll', letGo, { passive: true });
        // A finger or wheel on the box is always the reader, even mid-animation.
        ['wheel', 'touchstart'].forEach(function (ev) {
          body.addEventListener(ev, function () { ownScrollUntil = 0; }, { passive: true });
        });
      }
      function follow(el, force) {
        if (!body || !el || (!synced && !force)) return;
        var search = $('[data-transcript-search]');
        if (!force && search && search.hasAttribute('data-open')) return;
        var er = el.getBoundingClientRect(), br = body.getBoundingClientRect();
        var target = Math.max(0, body.scrollTop + er.top - br.top - 8);
        if (Math.abs(target - body.scrollTop) < 4) return;
        // Our own scrolling mustn't read as the reader taking over.
        ownScrollUntil = Date.now() + (reduced.matches ? 150 : 1000);
        body.scrollTo({ top: target, behavior: reduced.matches ? 'auto' : 'smooth' });
      }
      // Preview: each spoken sentence slides up to sit just under the
      // box's 2.5rem top fade.
      function pin(el) {
        if (!body || !el) return;
        var er = el.getBoundingClientRect(), br = body.getBoundingClientRect();
        var target = Math.max(0, body.scrollTop + er.top - br.top - 44);
        if (Math.abs(target - body.scrollTop) < 4) return;
        ownScrollUntil = Date.now() + (reduced.matches ? 150 : 1000);
        body.scrollTo({ top: target, behavior: reduced.matches ? 'auto' : 'smooth' });
      }
      // The preview isn't scrollable, so a tap on it (or on its Expand
      // pill) opens the drawer rather than seeking.
      var openBtn = $('[data-transcript-expand]');
      var pill = $('[data-transcript-expand-pill]');
      function openDrawer(e) {
        if (!preview() || !openBtn) return;
        e.preventDefault();
        e.stopPropagation();
        openBtn.click();
      }
      if (body) body.addEventListener('click', openDrawer, true);
      if (pill) pill.addEventListener('click', openDrawer, true);
      // Back in the box after the drawer: re-pin to wherever it's got to.
      d.addEventListener('vci:modal:close', function (e) {
        if (e.detail && e.detail.key === 'transcript') followed = null;
      });
      function resync() {
        synced = true;
        showSync();
        followed = row;
        follow(row, true);
      }
      if (syncBtn) syncBtn.addEventListener('click', function (e) {
        e.preventDefault();
        resync();
      });
      // Tapping a timestamp is choosing where to be: follow from there.
      cues.forEach(function (c) {
        c.row.addEventListener('click', function () { synced = true; showSync(); });
      });

      setInterval(function () {
        if (!player || !ready || !player.getCurrentTime) return;
        var t = player.getCurrentTime(),
          act = null;
        for (var i = 0; i < cues.length; i++) {
          if (cues[i].s <= t + 0.3) act = cues[i];
          else break;
        }
        var now = null;
        if (act && act.sents.length) {
          now = act.sents[0];
          act.sents.forEach(function (x) { if (x.at <= t + 0.3) now = x; });
        }
        if ((act && act.row) !== row) {
          if (row) row.removeAttribute('data-t-active');
          row = act ? act.row : null;
          if (row) row.setAttribute('data-t-active', '');
        }
        var el = now ? now.el : null;
        if (el !== sent) {
          if (sent) sent.removeAttribute('data-t-now');
          sent = el;
          if (sent) sent.setAttribute('data-t-now', '');
        }
        // Move only when a new timestamped section starts, bringing it to the
        // top of the box; within a section the box stays still and only the
        // sentence highlight moves.
        if (preview()) {
          // Always in step, playing or not, so it matches wherever the
          // drawer was left or the video was seeked to.
          synced = true;
          var at = sent || row;
          if (at && at !== followed) { followed = at; pin(at); }
        } else if (state() === 1 && synced && row && row !== followed) {
          followed = row;
          follow(row);
        }
        showSync();
      }, 400);
      tools();
    }

    /* ---------- copy · download · search ---------- */
    function tools() {
      var rt = $('[data-transcript]');
      var body = $('.media-transcript_body');
      var bar = $('[data-transcript-tools]');
      if (!rt || !body || !bar) return;
      var hasText = !!rt.textContent.trim();
      bar.querySelectorAll('[data-transcript-search-toggle], [data-transcript-copy], [data-transcript-download]').forEach(function (b) {
        b.style.display = hasText ? '' : 'none';
      });
      if (!hasText) return;

      var live = d.createElement('span');
      live.className = 'transcript-sr';
      live.setAttribute('role', 'status');
      bar.appendChild(live);
      function say(msg) {
        live.textContent = '';
        setTimeout(function () { live.textContent = msg; }, 50);
      }

      // Plain text: "0:04  Please pray with me…", a blank line between rows.
      function plain() {
        var rows = rt.querySelectorAll('[data-t-row]');
        if (!rows.length) return rt.innerText.trim();
        return Array.prototype.map.call(rows, function (r) {
          var t = r.querySelector('[data-t-time]'), x = r.querySelector('[data-t-text]');
          return (t ? t.textContent.trim() + '  ' : '') + (x ? x.textContent : r.textContent).replace(/\s+/g, ' ').trim();
        }).join('\n\n');
      }
      var title = ($('.media-title_wrap h1') || {}).textContent || d.title;
      title = title.trim();

      var copyBtn = $('[data-transcript-copy]');
      var copyTimer = 0;
      if (copyBtn) copyBtn.addEventListener('click', function () {
        var text = plain();
        var done = function () {
          copyBtn.setAttribute('data-done', '');
          copyBtn.setAttribute('aria-label', 'Transcript copied');
          say('Transcript copied');
          clearTimeout(copyTimer);
          copyTimer = setTimeout(function () {
            copyBtn.removeAttribute('data-done');
            copyBtn.setAttribute('aria-label', 'Copy transcript');
          }, 2000);
        };
        var fallback = function () {
          var ta = d.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
          copyBtn.parentElement.appendChild(ta);
          ta.select();
          var ok = false;
          try { ok = d.execCommand('copy'); } catch (e) {}
          ta.remove();
          copyBtn.focus();
          if (ok) done(); else say('Copy failed');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      });

      var dlBtn = $('[data-transcript-download]');
      if (dlBtn) dlBtn.addEventListener('click', function () {
        var speakers = Array.prototype.map.call(d.querySelectorAll('.media-byline .contributor_content > :first-child'), function (n) {
          return n.textContent.trim();
        }).filter(Boolean).join(', ');
        var date = ($('[data-current-date]') || $('.media-meta') || {}).textContent || '';
        var head = [title, [speakers, date.trim()].filter(Boolean).join(' · '), 'Christ the King Church', location.origin + location.pathname]
          .filter(Boolean).join('\n');
        var blob = new Blob([head + '\n\n' + plain() + '\n'], { type: 'text/plain;charset=utf-8' });
        var slug = title.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'sermon';
        var a = d.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = slug + '-transcript.txt';
        d.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        say('Transcript downloaded');
      });

      /* Search: highlights through the CSS Custom Highlight API, so the
         transcript's DOM (and its timestamp rows) is never rewritten. Where
         that API is missing, matches are still counted and scrolled to. */
      var row = $('[data-transcript-search]');
      var toggle = $('[data-transcript-search-toggle]');
      var input = row && $('[data-transcript-query]', row);
      var count = row && $('[data-transcript-count]', row);
      if (!row || !toggle || !input) return;
      var HL = !!(window.CSS && CSS.highlights && window.Highlight);
      var ranges = [], at = -1, qt = 0;

      function clearHL() {
        if (HL) { CSS.highlights.delete('transcript-match'); CSS.highlights.delete('transcript-current'); }
      }
      function find(q) {
        ranges = []; at = -1;
        clearHL();
        q = q.trim().toLowerCase();
        if (q.length < 2) { count.textContent = ''; return; }
        var w = d.createTreeWalker(rt, NodeFilter.SHOW_TEXT, {
          acceptNode: function (n) { return n.parentElement.closest('[data-t-time]') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; },
        });
        var n;
        while ((n = w.nextNode())) {
          var s = n.data.toLowerCase(), i = s.indexOf(q);
          while (i !== -1) {
            var r = d.createRange();
            r.setStart(n, i);
            r.setEnd(n, i + q.length);
            ranges.push(r);
            i = s.indexOf(q, i + q.length);
          }
        }
        if (HL && ranges.length) CSS.highlights.set('transcript-match', new Highlight(...ranges));
        if (!ranges.length) { count.textContent = 'No matches'; return; }
        go(0);
      }
      function go(i) {
        if (!ranges.length) return;
        at = (i + ranges.length) % ranges.length;
        count.textContent = at + 1 + ' of ' + ranges.length;
        var r = ranges[at];
        if (HL) CSS.highlights.set('transcript-current', new Highlight(r));
        var rr = r.getBoundingClientRect(), br = body.getBoundingClientRect();
        if (rr.top < br.top + 8 || rr.bottom > br.bottom - 8) {
          body.scrollTo({ top: body.scrollTop + rr.top - br.top - body.clientHeight / 3, behavior: reduced.matches ? 'auto' : 'smooth' });
        }
      }
      function openSearch() {
        row.setAttribute('data-open', '');
        toggle.setAttribute('aria-expanded', 'true');
        input.focus();
        if (input.value) find(input.value);
      }
      function closeSearch() {
        row.removeAttribute('data-open');
        toggle.setAttribute('aria-expanded', 'false');
        clearHL();
        toggle.focus();
      }
      toggle.addEventListener('click', function () {
        if (!row.hasAttribute('data-open')) openSearch(); else closeSearch();
      });
      input.addEventListener('input', function () {
        clearTimeout(qt);
        qt = setTimeout(function () { find(input.value); }, 150);
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); go(at + (e.shiftKey ? -1 : 1)); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeSearch(); }
      });
      var prev = $('[data-transcript-prev]', row), next = $('[data-transcript-next]', row);
      if (prev) prev.addEventListener('click', function () { go(at - 1); });
      if (next) next.addEventListener('click', function () { go(at + 1); });
    }

    if (d.readyState !== 'loading') {
      build();
      api();
    } else {
      d.addEventListener('DOMContentLoaded', function () {
        build();
        api();
      });
    }
  })();
</script>
