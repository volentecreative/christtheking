<style>
  [data-t-row] {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.85rem;

    align-items: baseline;
    margin: 0;
    padding: 0.5rem 0.6rem;
    border-radius: 0.4rem;
    cursor: pointer;
    color: var(--_theme---text-03);
    transition:
      color 0.15s ease,
      background-color 0.15s ease;
  }
  @media (hover: hover) {
    [data-t-row]:hover {
      background: rgba(255, 255, 255, 0.06);
    }
  }
  [data-t-row][data-t-active] {
    color: var(--_theme---text-01);
  }

  [data-t-s] {
    padding: 0.1em 0.2em;
    margin: 0 -0.2em;
    border-radius: 0.3em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-color 0.25s ease;
  }
  [data-t-row][data-t-active] [data-t-s][data-t-now] {
    background-color: color-mix(in srgb, var(--_theme---accent-01) 20%, transparent);
  }

  [data-t-time] {
    color: inherit;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    text-decoration: none;
    white-space: nowrap;
  }
  [data-t-text] {
    display: block;
    color: inherit;
  }

  .media-transcript_header > :is(h2, h3) {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  [data-transcript-tools] {
    margin-left: auto;
    flex: none;
  }

  [data-transcript-copy][data-done] [data-icon='done'] {
    display: block;
  }
  [data-transcript-copy][data-done] [data-icon='copy'] {
    display: none;
  }

  [data-transcript-search][data-open] {
    display: flex;
  }
  [data-transcript-search] .media-filters_search {
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
    order: 0;
  }
  [data-transcript-search] .media-filters_input {
    max-width: none;
    min-width: 0;
    min-height: 2.5rem;
    padding-right: 1rem;
    font-size: 16px;
  }
  [data-transcript-count]:empty {
    display: none;
  }
  [data-transcript-count] {
    flex: none;
    min-width: 4.5em;
    text-align: right;
    white-space: nowrap;
  }
  ::highlight(transcript-match) {
    background-color: color-mix(in srgb, var(--_theme---accent-01) 35%, transparent);
    color: var(--_theme---text-01);
  }
  ::highlight(transcript-current) {
    background-color: var(--_theme---accent-01);
    color: var(--_theme---background-01);
  }
  .transcript-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .media-transcript_body {
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 1rem, black calc(100% - 1rem), transparent);
  }

  .media-transcript_body[data-at-top] {
    -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 1rem), transparent);
    mask-image: linear-gradient(to bottom, black calc(100% - 1rem), transparent);
  }

  [data-transcript-sync][data-show] {
    display: block;
  }
  .media-transcript.is-visible [data-transcript-close] {
    display: flex;
  }

  .media-transcript.is-visible [data-transcript-grab] {
    display: block;
  }
  @media (max-width: 991px) {
    .media-secondary.is-visible > [vci-modal='scrim'] {
      display: block;
    }
    .media-transcript.is-visible {
      padding-bottom: env(safe-area-inset-bottom);
    }

    [data-transcript-preview] .media-transcript_body {
      overflow: hidden;
      cursor: pointer;

      -webkit-mask-image: linear-gradient(to bottom, transparent, black 2.5rem, black calc(100% - 4.5rem), transparent);
      mask-image: linear-gradient(to bottom, transparent, black 2.5rem, black calc(100% - 4.5rem), transparent);
    }
    [data-transcript-preview] .media-transcript_body[data-at-top] {
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 4.5rem), transparent);
      mask-image: linear-gradient(to bottom, black calc(100% - 4.5rem), transparent);
    }

    [data-transcript-preview] [data-transcript-expand-pill] {
      display: block;
    }

    .media-secondary [data-t-row],
    [data-transcript-preview] [data-t-row] {
      color: var(--_theme---text-02);
    }
    .media-secondary [data-t-row][data-t-active],
    [data-transcript-preview] [data-t-row][data-t-active] {
      color: var(--_theme---text-01);
    }
  }
</style>
