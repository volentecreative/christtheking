<!-- Christ the King — Media Template page → HTML Embed "breadcrumb-handler"
     (the embed with class .breadcrumb-handler, near the top of the page).
     Page-level footer code cannot be written on this template through the
     API, so the script lives in an embed. This file is its source of truth. -->
<style>
/* Tablet/phone: the series playlist is a narthex accordion (vci-accordion on
   .media-series_playlist / .media-series_body), closed by default, so the
   card is just its header ("More in …", the "13 of 16" toggle) and the
   Previous / Next pair. Desktop keeps it open. The "16 items" count is the
   toggle's job down here. */
/* Desktop: undo narthex's collapse CSS (grid rows + overflow:hidden on the
   child), which would clip the list instead of letting the 20rem box scroll. */
@media (min-width: 992px) {
  .media-series_playlist .media-series_body { display: block; }
  .media-series_playlist .media-series_body > * { overflow: visible; }
}
@media (max-width: 991px) {
  .media-series_playlist:not([vci-accordion-state="open"]) .media-series_body { display: none; }
  [data-series-total] { display: none; }
}
</style>
<script>
/* ===========================================================================
   Media item page. Two jobs, both of which the style panel genuinely can't do.

   1. Breadcrumb filter links. Each crumb's label comes from a CMS field and the
      href is built from it, so a new Type option or Media Series links to the
      right filter with no per-item filter-URL field. Webflow cannot concatenate
      a query string, and an Option field cannot be bound to a link at all.

   2. Series position. "3 of 11", "11 items", and the row numbers in the series
      playlist are all counted from the playlist itself. There is deliberately
      no "part number" CMS field to keep in sync: add a sermon to a series and
      everything renumbers on its own. Order is the Date field. The same
      count drives the series Previous / Next links ([data-series-prev],
      [data-series-next]), and hides the date-order nav ([data-date-nav],
      Finsweet previous-item / next-item) when the item is in a series. The
      current row gets .is-active and is centred in the playlist's scroll box.
   Source of truth: webflow/embeds/media-template-crumbs-and-series.html in the repo.
   =========================================================================== */
(function () {
  'use strict';

  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var path = function (p) { return String(p || '').replace(/\/+$/, ''); };

  function crumbs() {
    document.querySelectorAll('[data-crumb-filter]').forEach(function (crumb) {
      var field = crumb.getAttribute('data-crumb-filter');
      /* Take the value from the marked child when there is one. The series
         crumb is a chip - thumbnail, series name, "3 of 11" - so its own
         textContent reads "Congregational Worship3 of 11" and would build a
         filter that matches nothing. */
      var src = crumb.querySelector('[data-crumb-value]') || crumb;
      var value = (src.textContent || '').trim();
      crumb.href = value
        ? '/media?' + field + '_equal=' + encodeURIComponent(value)
        : '/media';
    });
  }

  function series() {
    var rows = Array.prototype.slice.call(document.querySelectorAll('[data-series-row]'));
    if (!rows.length) return;

    var here = path(location.pathname);
    var items = rows.map(function (row, i) {
      var link = row.querySelector('a[href]');
      var when = row.querySelector('[data-series-date]');
      return {
        row: row,
        order: i,
        current: !!link && path(link.pathname) === here,
        time: when ? Date.parse(when.textContent.trim()) : NaN
      };
    });

    /* Date order is series order. If any date fails to parse, keep the
       Collection List's own order rather than shuffling rows at random. */
    var dated = items.every(function (it) { return !isNaN(it.time); });
    if (dated) items.sort(function (a, b) { return a.time - b.time || a.order - b.order; });

    var index = -1;
    items.forEach(function (it, n) { if (it.current) index = n; });
    var listed = index !== -1;
    var total = items.length;

    if (!listed) {
      /* The playlist filters this item out, so it is one row short and this
         item's own slot has to be placed by date. */
      var mark = document.querySelector('[data-current-date]');
      var now = mark ? Date.parse(mark.textContent.trim()) : NaN;
      total = items.length + 1;
      index = 0;
      if (dated && !isNaN(now)) items.forEach(function (it) { if (it.time < now) index++; });
    }

    items.forEach(function (it, n) {
      var label = it.row.querySelector('[data-series-index]');
      if (label) label.textContent = pad((listed || n < index ? n : n + 1) + 1);
    });

    /* The row being watched gets .is-active - the site's active-item pattern,
       as on the jump menu's .sticky-menu-nav-item.is-active: gold 2px border,
       surface background, gold text (style panel) - and is scrolled to the
       middle of the playlist box. The box is scrolled directly - scrollIntoView would move the whole page too. */
    if (listed) {
      var row = items[index].row;
      row.classList.add('is-active');
      var box = row.parentElement;
      while (box && box !== document.body && !(box.scrollHeight > box.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(box).overflowY))) box = box.parentElement;
      if (box && box !== document.body) {
        box.scrollTop += row.getBoundingClientRect().top - box.getBoundingClientRect().top - (box.clientHeight - row.offsetHeight) / 2;
      }
    }

    document.querySelectorAll('[data-series-count]').forEach(function (el) {
      el.textContent = (index + 1) + ' of ' + total;
    });
    document.querySelectorAll('[data-series-total]').forEach(function (el) {
      el.textContent = total + (total === 1 ? ' item' : ' items');
    });

    /* Previous / next within the series: "13 · Beware Men Like Tobiah". The
       earlier part is Previous. At either end that side keeps its place but
       is hidden, so the other one doesn't jump across the bar. */
    var before = items[index - 1];
    var after = listed ? items[index + 1] : items[index];
    var partOf = function (it) {
      var n = items.indexOf(it);
      return (listed || n < index ? n : n + 1) + 1;
    };
    [['[data-series-prev]', before, 'Previous'], ['[data-series-next]', after, 'Next']].forEach(function (side) {
      document.querySelectorAll(side[0]).forEach(function (a) {
        var it = side[1];
        var to = it && it.row.querySelector('a[href]');
        if (!to) {
          a.style.visibility = 'hidden';
          a.setAttribute('aria-hidden', 'true');
          a.setAttribute('tabindex', '-1');
          return;
        }
        var heading = it.row.querySelector('h1, h2, h3, h4');
        var title = heading ? heading.textContent.trim() : '';
        var part = partOf(it);
        a.href = to.getAttribute('href');
        a.title = title;
        a.setAttribute('aria-label', side[2] + ' in series: part ' + part + (title ? ', ' + title : ''));
        var label = a.querySelector('[data-series-label]');
        if (label) label.textContent = pad(part) + (title ? ' · ' + title : '');
      });
    });
    if (total < 2) {
      document.querySelectorAll('[data-series-prev], [data-series-next]').forEach(function (a) {
        if (a.parentElement) a.parentElement.style.display = 'none';
      });
    }

    /* A sermon in a series gets the series buttons above; the date-order
       Previous / Next at the foot of the page is only for one-offs. */
    document.querySelectorAll('[data-date-nav]').forEach(function (el) { el.style.display = 'none'; });
    return { total: total, index: index };
  }

  /* Desktop: always open. Tablet/phone: closed until the toggle is used.
     narthex reads vci-accordion-open when it starts, after this has run. */
  function disclosure(total, index) {
    var item = document.querySelector('.media-series_playlist[vci-accordion="item"]');
    if (!item) return;
    var wide = matchMedia('(min-width: 992px)');
    if (wide.matches) item.setAttribute('vci-accordion-open', 'true');
    wide.addEventListener('change', function (e) {
      if (e.matches && window.vci && vci.accordion) vci.accordion.open(item);
    });
    var t = item.querySelector('[data-series-toggle]');
    if (!t) return;
    if (total < 2) { t.parentElement.style.display = 'none'; return; }
    t.setAttribute('aria-label', 'Part ' + (index + 1) + ' of ' + total + '. Show all parts');
  }

  function init() { crumbs(); var s = series(); disclosure(s ? s.total : 0, s ? s.index : 0); }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
