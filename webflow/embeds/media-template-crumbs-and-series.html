<style>
.media-series_playlist .media-transcript_header > .horz-flex { flex-wrap: wrap; min-width: 0; }
.media-series_playlist .media-transcript_header > .horz-flex > :is(h2, h3) { white-space: nowrap; }

.breadcrumb {
  -webkit-mask-image: linear-gradient(to right, transparent, black 2rem, black calc(100% - 2rem), transparent);
  mask-image: linear-gradient(to right, transparent, black 2rem, black calc(100% - 2rem), transparent);
}
.breadcrumb[data-at-start] {
  -webkit-mask-image: linear-gradient(to right, black calc(100% - 2rem), transparent);
  mask-image: linear-gradient(to right, black calc(100% - 2rem), transparent);
}
.breadcrumb[data-at-end] {
  -webkit-mask-image: linear-gradient(to right, transparent, black 2rem);
  mask-image: linear-gradient(to right, transparent, black 2rem);
}
.breadcrumb[data-at-start][data-at-end] {
  -webkit-mask-image: none;
  mask-image: none;
}

.media-series_body {
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 1.5rem, black calc(100% - 1.5rem), transparent);
  mask-image: linear-gradient(to bottom, transparent, black 1.5rem, black calc(100% - 1.5rem), transparent);
}
.media-series_body[data-at-top] {
  -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 1.5rem), transparent);
  mask-image: linear-gradient(to bottom, black calc(100% - 1.5rem), transparent);
}
.media-series_body[data-at-bottom] {
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 1.5rem);
  mask-image: linear-gradient(to bottom, transparent, black 1.5rem);
}
.media-series_body[data-at-top][data-at-bottom] {
  -webkit-mask-image: none;
  mask-image: none;
}

[data-series-row]:not([data-meta~="speaker"]) [data-series-speakers],
[data-series-row]:not([data-meta="speaker date"]) .meta-divider,
[data-series-row][data-meta]:not([data-meta~="date"]) [data-series-date] {
  display: none;
}

[data-series-speakers] .w-dyn-items { display: flex; flex-wrap: wrap; column-gap: 0.3em; }
[data-series-speakers] .w-dyn-item:not(:last-child) > *::after { content: ","; }
[data-series-speakers] .w-dyn-item:first-child:nth-last-child(2) > *::after { content: none; }
[data-series-speakers] .w-dyn-item:last-child:not(:first-child) > *::before { content: "and "; }
</style>
<script>
(function() {
  'use strict';
  var pad = function(n) {
    return (n < 10 ? '0' : '') + n;
  };
  var path = function(p) {
    return String(p || '').replace(/\/+$/, '');
  };
  function crumbs() {
    document.querySelectorAll('[data-crumb-filter]').forEach((function(crumb) {
      var field = crumb.getAttribute('data-crumb-filter');
      var src = crumb.querySelector('[data-crumb-value]') || crumb;
      var value = (src.textContent || '').trim();
      crumb.href = value ? '/media?' + field + '_equal=' + encodeURIComponent(value) : '/media';
    }));
  }
  function crumbFades() {
    document.querySelectorAll('.breadcrumb').forEach((function(bar) {
      var mark = function() {
        var max = bar.scrollWidth - bar.clientWidth;
        bar.toggleAttribute('data-at-start', bar.scrollLeft <= 1);
        bar.toggleAttribute('data-at-end', bar.scrollLeft >= max - 1);
      };
      mark();
      bar.addEventListener('scroll', mark, {
        passive: true
      });
      window.addEventListener('resize', mark);
    }));
  }
  function listFades() {
    document.querySelectorAll('.media-series_body').forEach((function(box) {
      var mark = function() {
        var max = box.scrollHeight - box.clientHeight;
        box.toggleAttribute('data-at-top', box.scrollTop <= 1);
        box.toggleAttribute('data-at-bottom', box.scrollTop >= max - 1);
      };
      mark();
      box.addEventListener('scroll', mark, {
        passive: true
      });
      window.addEventListener('resize', mark);
    }));
  }
  function series() {
    var rows = Array.prototype.slice.call(document.querySelectorAll('[data-series-row]'));
    if (!rows.length) return;
    var here = path(location.pathname);
    var items = rows.map((function(row, i) {
      var link = row.querySelector('a[href]');
      var when = row.querySelector('[data-series-date]');
      return {
        row: row,
        order: i,
        current: !!link && path(link.pathname) === here,
        time: when ? Date.parse(when.textContent.trim()) : NaN
      };
    }));
    var dated = items.every((function(it) {
      return !isNaN(it.time);
    }));
    if (dated) items.sort((function(a, b) {
      return a.time - b.time || a.order - b.order;
    }));
    var index = -1;
    items.forEach((function(it, n) {
      if (it.current) index = n;
    }));
    var listed = index !== -1;
    var total = items.length;
    if (!listed) {
      var mark = document.querySelector('[data-current-date]');
      var now = mark ? Date.parse(mark.textContent.trim()) : NaN;
      total = items.length + 1;
      index = 0;
      if (dated && !isNaN(now)) items.forEach((function(it) {
        if (it.time < now) index++;
      }));
    }
    var who = function(it) {
      return Array.prototype.map.call(it.row.querySelectorAll('[data-series-speakers] .w-dyn-item'), (function(n) {
        return n.textContent.trim();
      })).filter(Boolean).join(', ');
    };
    var names = items.map(who);
    var mine = Array.prototype.map.call(document.querySelectorAll('.media-byline .contributor_content > :first-child'), (function(n) {
      return n.textContent.trim();
    })).filter(Boolean).join(', ');
    var mixed = names.concat(listed ? [] : [ mine ]).filter((function(n, i, all) {
      return n && all.indexOf(n) === i;
    })).length > 1;
    var times = items.map((function(it) {
      return it.time;
    }));
    var event = dated && Math.max.apply(null, times) - Math.min.apply(null, times) <= 7 * 864e5;
    items.forEach((function(it, n) {
      var show = !mixed || !names[n] ? 'date' : event ? 'speaker' : 'speaker date';
      it.row.setAttribute('data-meta', show);
    }));
    items.forEach((function(it, n) {
      var label = it.row.querySelector('[data-series-index]');
      if (label) label.textContent = pad((listed || n < index ? n : n + 1) + 1);
    }));
    if (dated) items.slice().reverse().forEach((function(it) {
      it.row.parentNode.appendChild(it.row);
    }));
    if (listed) {
      var row = items[index].row;
      row.classList.add('is-active');
      var box = row.parentElement;
      while (box && box !== document.body && !(box.scrollHeight > box.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(box).overflowY))) box = box.parentElement;
      if (box && box !== document.body) {
        box.scrollTop += row.getBoundingClientRect().top - box.getBoundingClientRect().top - (box.clientHeight - row.offsetHeight) / 2;
      }
    }
    document.querySelectorAll('[data-series-count]').forEach((function(el) {
      el.textContent = index + 1 + ' of ' + total;
    }));
    document.querySelectorAll('[data-series-total]').forEach((function(el) {
      el.textContent = 'All ' + total;
    }));
    var before = items[index - 1];
    var after = listed ? items[index + 1] : items[index];
    var partOf = function(it) {
      var n = items.indexOf(it);
      return (listed || n < index ? n : n + 1) + 1;
    };
    [ [ '[data-series-prev]', before, 'Previous' ], [ '[data-series-next]', after, 'Next' ] ].forEach((function(side) {
      document.querySelectorAll(side[0]).forEach((function(a) {
        var it = side[1];
        var to = it && it.row.querySelector('a[href]');
        if (!to) {
          a.style.visibility = 'hidden';
          a.setAttribute('aria-hidden', 'true');
          a.setAttribute('tabindex', '-1');
          return;
        }
        var heading = it.row.querySelector('h1, h2, h3, h4');
        var title = heading ? heading.textContent.trim() : '';
        var part = partOf(it);
        a.href = to.getAttribute('href');
        a.title = title;
        a.setAttribute('aria-label', side[2] + ' in series: part ' + part + (title ? ', ' + title : ''));
        var label = a.querySelector('[data-series-label]');
        if (label) label.textContent = pad(part) + (title ? ' · ' + title : '');
      }));
    }));
    if (total < 2) {
      document.querySelectorAll('[data-series-prev], [data-series-next]').forEach((function(a) {
        if (a.parentElement) a.parentElement.style.display = 'none';
      }));
    }
    document.querySelectorAll('[data-date-nav]').forEach((function(el) {
      el.style.display = 'none';
    }));
    return {
      total: total,
      index: index
    };
  }
  function seriesLink(total) {
    var chip = document.querySelector('[data-crumb-filter="series"]');
    var name = chip && chip.querySelector('[data-crumb-value]');
    document.querySelectorAll('[data-series-link]').forEach((function(a) {
      if (!chip || !name || !name.textContent.trim()) {
        a.style.display = 'none';
        return;
      }
      a.href = chip.getAttribute('href');
      a.setAttribute('aria-label', 'View all ' + (total ? total + ' ' : '') + 'in ' + name.textContent.trim());
    }));
  }
  function init() {
    crumbs();
    crumbFades();
    var s = series();
    seriesLink(s ? s.total : 0);
    listFades();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
