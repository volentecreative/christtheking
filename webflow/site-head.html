<!-- Christ the King: site-wide HEAD code. Readable source and notes: github.com/volentecreative/christtheking, webflow/site-head.html + webflow/CUSTOM-CODE.md -->
<script>
(function() {
  'use strict';
  function init() {
    var menu = document.querySelector('.sticky-menu');
    if (!menu || document.querySelector('[data-jump-toggle]')) return;
    var map = [];
    menu.querySelectorAll('a[href^="#"]').forEach((function(a) {
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) map.push({
        link: a,
        target: target
      });
    }));
    if (!map.length) return;
    function headerOffset() {
      var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-offset'));
      if (!isNaN(v)) return v;
      var n = document.querySelector('.navbar');
      return n ? n.offsetHeight : 72;
    }
    var current = null;
    function spy() {
      var offset = headerOffset() + 32;
      var active = map[0];
      map.forEach((function(m) {
        if (m.target.getBoundingClientRect().top <= offset) active = m;
      }));
      if (active === current) return;
      current = active;
      map.forEach((function(m) {
        m.link.classList.toggle('is-current', m === active);
      }));
    }
    window.addEventListener('scroll', spy, {
      passive: true
    });
    window.addEventListener('resize', spy);
    spy();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
