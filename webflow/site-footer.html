<!-- Christ the King — Site settings → Custom code → FOOTER
     Post-narthex-migration state. See narthex docs/migration-christtheking.md.

     What used to be here and is now narthex:
       - the ~200-line modal/drawer IIFE (data-modal-open, data-modal-close,
         .modal-dim, ?modal= deep links, swipe-to-dismiss)
         → the modal module, via vci-modal="dialog|open|close|dim|title"
     Also retired alongside it: the applied registered script
     "faq_accordion_toggle" → the accordion module.

     What is left is presentation, and stays: the parallax keyframes and the
     Turnstile hiding rule. -->

<!-- Pin a tag that exists. jsDelivr resolves @<tag> against the repo's git
     tags and 404s anything else — silently, as far as the page is concerned:
     no narthex, so no mobile menu. v0.2.0 was the example version in the
     narthex README's release section and was never cut; the tags are v0.1.0,
     v0.1.1, v0.4.0, v0.5.0, v0.5.1. -->
<script src="https://cdn.jsdelivr.net/gh/volentecreative/narthex@v0.5.1/dist/narthex.min.js"
        vci-scroll="native"
        vci-scroll-offset="calc(var(--nav-height, 4.5rem) + 1.5rem)"></script>

<script>
(() => {
  const style = document.createElement('style');

  style.textContent = `
    .parallax-5,
    .parallax-10,
    .parallax-20 {
      animation-name: cf-parallax-y;
      animation-duration: 1ms;
      animation-timing-function: linear;
      animation-fill-mode: both;
      animation-timeline: view();
      animation-range: entry 0% exit 100%;
      will-change: transform;
    }

    .parallax-5 {
      --parallax-distance: 5%;
    }

    .parallax-10 {
      --parallax-distance: 10%;
    }

    .parallax-20 {
      --parallax-distance: 20%;
    }

    @keyframes cf-parallax-y {
      from {
        transform: translateY(calc(var(--parallax-distance) * -1));
      }

      to {
        transform: translateY(var(--parallax-distance));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .parallax-5,
      .parallax-10,
      .parallax-20 {
        animation: none;
        transform: none;
      }
    }
  `;

  document.head.appendChild(style);
})();
</script>

<style>
/* Nav dropdown open/close, in place of the deleted Interactions.

   Webflow keeps its own plumbing: its dropdown JS still toggles w--open on the
   toggle and the list, and this is only the styling of those two states. What
   it has to undo is `.w-dropdown-list { display: none }` — display cannot
   transition, which is why an Interaction was needed in the first place. With
   the list always rendered, opacity carries both directions, and the close
   animates as well as the open.

   It is here rather than in the Designer because the closed state needs
   `visibility: hidden` to keep the links out of the tab order, and the style
   panel has no visibility property. The delayed visibility is what lets the
   fade finish before the list stops being rendered.

   Desktop only. Below 992px the list is `position: static` inside the mobile
   panel, where forcing display:block would leave every dropdown's links taking
   up space while closed; there Webflow's own show/hide is left alone. */
@media (min-width: 992px) {
  .nav_dropdown-list.w-dropdown-list {
    display: block;
    visibility: hidden;
    opacity: 0;
    transition: opacity 200ms ease, visibility 0s linear 200ms;
  }

  .nav_dropdown-list.w-dropdown-list.w--open {
    visibility: visible;
    opacity: 1;
    transition-delay: 0s;
  }

  .navbar_dropdown-toggle .chevron_down {
    transition: transform 200ms ease;
  }

  .navbar_dropdown-toggle.w--open .chevron_down {
    transform: rotate(180deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .nav_dropdown-list.w-dropdown-list,
  .navbar_dropdown-toggle .chevron_down {
    transition: none;
  }
}
</style>

<style>
/* The Turnstile widget's wrapper div, hidden without removing it from the form.
   The closing brace was missing in the live block — browsers recover at the end
   of a stylesheet, so it worked, but nothing may be appended after it. */
.media-filter-form > div:has([name="cf-turnstile-response"]) {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}
</style>
