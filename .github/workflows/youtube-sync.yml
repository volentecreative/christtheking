# YouTube -> Webflow sync. Daily, plus by hand.
#
# YouTube throttles and blocks GitHub-hosted runner IPs. Evidence from this
# project: on a residential IP an unauthenticated run degraded from 44s to 240s+
# per video, then failed 79 videos in a row. A shared cloud IP is worse, and the
# fix that worked locally (browser cookies) does not transfer - cookies expire
# in days and a login session does not belong in CI secrets.
#
# Expect the per-video fetch to be refused here ("Sign in to confirm you're not
# a bot"). That is NOT a broken run and does not fail the job: the channel
# listing still answers, so a video missing from Webflow is created from it with
# the title, duration, type, date and thumbnail, and only the description and
# transcript are left blank for a later run to fill. See "When YouTube won't
# answer" in the README.
#
# That is enough to run unattended, so this is scheduled: new sermons land on
# the site every day with nobody touching it. It runs an hour before sync.yml
# because the podcast step matches episodes onto the items this one creates.
# Descriptions and transcripts still need a run from a machine YouTube answers
# (sync-all.js on a Mac); every scheduled run retries them meanwhile, since a
# partial item is never marked synced.
name: YouTube sync

on:
  schedule:
    - cron: '0 14 * * *' # daily, 9am CT (14:00 UTC during CDT) - before sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only - write nothing'
        type: boolean
        default: true
      max_work:
        description: 'Max videos to fetch this run'
        default: '15'

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install yt-dlp
        run: |
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
      - name: Run tests
        run: node --test test/*.test.js
      - name: Sync
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: node sync-youtube.js ${{ inputs.dry_run && '--dry-run' || '' }} --max-work ${{ inputs.max_work || '15' }} --concurrency 2 --verbose
