# The whole automated pipeline, one job, daily: YouTube, then podcast, then
# speaker-text. sync-all.js is the same thing for a Mac.
#
# Apple, Spotify and Webflow have no bot check, so those steps run fine on a
# cloud runner. YouTube does NOT: it throttles and blocks GitHub-hosted runner
# IPs. Evidence from this project: on a residential IP an unauthenticated run
# degraded from 44s to 240s+ per video, then failed 79 videos in a row. A
# shared cloud IP is worse, and the fix that worked locally (browser cookies)
# does not transfer - cookies expire in days and a login session does not
# belong in CI secrets.
#
# Expect the per-video fetch to be refused here ("Sign in to confirm you're not
# a bot"). That is NOT a broken run and does not fail the job: the channel
# listing still answers, so a video missing from Webflow is created from it with
# the title, duration, type, date and thumbnail, and only the description and
# transcript are left blank. A partial item is never marked synced, so every
# run retries it, and a run from a machine YouTube answers (sync-all.js on a
# Mac) fills it in. See "When YouTube won't answer" in the README.
name: Sync

on:
  schedule:
    - cron: '0 15 * * *' # daily, 10am CT (15:00 UTC during CDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only - write nothing'
        type: boolean
        default: false
      skip_youtube:
        description: 'Skip the YouTube sync'
        type: boolean
        default: false
      skip_podcast:
        description: 'Skip the podcast sync'
        type: boolean
        default: false
      max_work:
        description: 'Max YouTube videos to fetch this run'
        default: '15'

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The unit suite needs no dependencies. The browser suite (*.test.mjs)
      # is deliberately a separate glob so this stays Playwright-free.
      - name: Run tests
        run: node --test test/*.test.js

      - name: Install yt-dlp
        if: ${{ !inputs.skip_youtube }}
        run: |
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      # First: the podcast step matches episodes onto the items this creates.
      # On a schedule there are no inputs, so max_work needs its own fallback.
      - name: YouTube → Webflow
        if: ${{ !inputs.skip_youtube }}
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: node sync-youtube.js ${{ inputs.dry_run && '--dry-run' || '' }} --max-work ${{ inputs.max_work || '15' }} --concurrency 2 --verbose

      # Runs even if the YouTube step failed — episodes for items already in
      # Webflow still match.
      - name: Podcast → Webflow
        if: ${{ always() && !inputs.skip_podcast }}
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node sync-podcast.js ${{ inputs.dry_run && '--dry-run' || '' }} --report podcast-report.csv --verbose

      # Last, so it reflects any speaker-s the steps above just filled.
      # Runs even if they failed — a drifted speaker-text is worth fixing either way.
      - name: Reconcile speaker text
        if: always()
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: node reconcile-speakers.js ${{ inputs.dry_run && '--dry-run' || '' }} --verbose

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-report
          path: podcast-report.csv
          if-no-files-found: ignore
