<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love the Standard | Christ the King Church</title>
  <style>
    /* Just enough of the site's layout to scroll the stage out of view. */
    :root { --_theme---background-01:#151413; --_theme---background-02:#1f1d1b; --_theme---background-03:#2a2724;
      --_theme---border-01:#1f1d1b; --_theme---border-02:#2a2724; --_theme---text-01:#fff; --_theme---text-02:#ccc; --_theme---text-03:#999;
      --_theme---accent-01:#d4af37; --border-radius-small:.5rem; --border-radius-medium:1rem; }
    body { margin: 0; background: var(--_theme---background-01); color: var(--_theme---text-01); font-family: sans-serif; }
    .navbar { position: sticky; top: 0; height: 72px; background: #000; z-index: 100; }
    .container { width: min(960px, 100% - 32px); margin: 0 auto; }
    .video-embed { aspect-ratio: 16 / 9; border-radius: var(--border-radius-medium); overflow: clip; margin-bottom: -.5rem; }
    .filler { height: 3000px; }
    .scroll-to-top_button { position: fixed; right: 16px; bottom: 16px; width: 44px; height: 44px; z-index: 90; }
    .media-transcript_body { max-height: 240px; overflow: auto; }
  </style>
</head>
<body>
  <nav class="navbar"></nav>
  <main class="container">
    <div class="media-primary">
      <div class="video-embed" data-video="true"{{STAGE_ATTRS}}></div>
      <div class="media-title_wrap">
        <h1>Love the Standard</h1>
        <div class="media-byline">
          <div class="media-byline_speakers">
            <div class="contributor_content"><p>Doug Wilson</p><p></p></div>
          </div>
        </div>
      </div>
    </div>
    <div class="media-secondary">
      <div class="media-transcript">
        <div class="media-transcript_header">
          <h3>Transcript</h3>
          <button type="button" data-transcript-play aria-label="Play"><span data-icon="play">▶</span><span data-icon="pause">❚❚</span></button>
          <div data-transcript-tools></div>
        </div>
        <div class="media-transcript_body">
          <div data-transcript class="w-richtext">
            <p><a href="#t=3.4">0:03</a> At a conference, it is always good to see people. This is the second sentence.</p>
            <p><a href="#t=50.1">0:50</a> Fifty seconds in. Another sentence here.</p>
            <p><a href="#t=120.0">2:00</a> Two minutes in. And more.</p>
          </div>
        </div>
        <div data-transcript-sync><a href="#">Synchronize</a></div>
      </div>
    </div>
    {{EMBED}}
    <div class="filler"></div>
  </main>
  <button class="scroll-to-top_button" aria-label="Scroll to top"></button>
  <script src="/media-player.js"></script>
</body>
</html>
